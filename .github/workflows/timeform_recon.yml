name: Timeform TFig Reconciliation

# Every morning after racing, read the previous day's Timeform "Race Result"
# PDFs from Google Drive, compare their Tfig column to our UK/IRE figures for
# that day, email a comparison report, and update the rolling correction. Runs
# at 10:00 UTC — late enough for the day's PDFs to be saved to Drive, and well
# before the 21:00 combined email.
#
# SOURCE: Google Drive, not the Timeform website. timeform.com's sign-in form is
# behind an image CAPTCHA (and an Azure Front Door WAF that challenges datacenter
# IPs), so an automated login can never complete from CI. The account owner saves
# the Timeform result PDFs to the same Drive folder the sectionals pipeline reads
# — <root>/DD.MM.YY/<Track>/Race Result HH_MM COURSE Weekday DD Month.pdf — and
# those carry the Tfig column we reconcile against. Auth is the same
# GDRIVE_SA_JSON service account as sectional_ratings.yml; share the folder
# read-only with the service-account email.
#
# The legacy Playwright scrape lives on behind `source: scrape`, which installs
# Chromium + xvfb on demand. It is not expected to work.

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Race date (YYYY-MM-DD), empty = yesterday'
        required: false
        default: ''
      source:
        description: 'TFig source: drive (Google Drive PDFs) | scrape (legacy, dead) | raw'
        required: false
        default: 'drive'
        type: choice
        options: ['drive', 'scrape', 'raw']
      capture_only:
        description: 'Legacy scrape only: dump raw HTML/JSON artifact, no reconcile/email'
        required: false
        default: 'false'
      send_email:
        description: 'Send the comparison email?'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  timeform-recon:
    runs-on: ubuntu-latest
    env:
      # Default source for scheduled runs; workflow_dispatch can override it.
      SOURCE: ${{ github.event.inputs.source || 'drive' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # pandas/numpy are not in requirements.txt (the other pipelines install
        # them explicitly), so add them here alongside pytest. pdfplumber and the
        # google-api client are already in requirements.txt.
        run: pip install -r requirements.txt pandas numpy pytest

      - name: Install Chromium for Playwright (+ xvfb)
        # Only for the legacy scrape source — the Drive path never touches a
        # browser, so the default run skips this entirely (~2 min saved, and it
        # cannot fail the job on browser setup).
        if: env.SOURCE == 'scrape' || github.event.inputs.capture_only == 'true'
        run: |
          python -m playwright install chromium --with-deps
          sudo apt-get install -y xvfb

      - name: Run offline parser/reconcile tests
        run: python -m pytest tests/timeform/ -q

      - name: Resolve target date
        id: d
        run: |
          DATE_ARG="${{ github.event.inputs.date }}"
          if [ -z "$DATE_ARG" ]; then
            # Anchor to the scheduled hour, not the wall clock. GitHub delays
            # scheduled runs under load -- routinely ~1h in this repo, and on
            # 2026-08-06 by four hours, which pushed this past midnight UTC so
            # `date -u` resolved to the 7th. The run rated a day that had not
            # been run yet, 6 August was skipped entirely, and nothing failed.
            # Backing off 6h keeps a 10:00 UTC cron on its own day for a delay of
            # up to ~14h, and can never resolve early because the run cannot
            # start before its cron fires.
            ANCHOR=$(date -u -d '6 hours ago' +%Y-%m-%d)
            DATE_ARG=$(date -u -d "$ANCHOR - 1 day" +%Y-%m-%d)
          fi
          echo "date=$DATE_ARG" >> "$GITHUB_OUTPUT"

      - name: Timeform reconciliation
        env:
          # Service account with read access to the Daily Sectional Reports
          # folder — the same secret sectional_ratings.yml uses.
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # Send the report to the account owner. Add addresses (comma-separated)
          # to widen distribution once the numbers are trusted.
          RATINGS_RECIPIENTS: racingsquared@gmail.com
          # Legacy scrape credentials — unused by the default Drive path.
          TIMEFORM_USER: ${{ secrets.TIMEFORM_USER }}
          TIMEFORM_PASS: ${{ secrets.TIMEFORM_PASS }}
          TIMEFORM_COOKIE: ${{ secrets.TIMEFORM_COOKIE }}
          PW_PROXY: ${{ secrets.PW_PROXY }}
        run: |
          set -euo pipefail
          D="${{ steps.d.outputs.date }}"
          FLAG=""
          if [ "${{ github.event.inputs.send_email }}" = "false" ]; then FLAG="--no-email"; fi

          if [ "${{ github.event.inputs.capture_only }}" = "true" ]; then
            # Legacy: dump the raw logged-in HTML/JSON only.
            HEADED="--headful"
            if [ -n "${PW_PROXY:-}" ]; then HEADED=""; fi
            xvfb-run -a python -m src.timeform.cli -v capture-html --date "$D" $HEADED
          elif [ "$SOURCE" = "scrape" ]; then
            # Legacy: headed under a virtual display so the login clears the WAF.
            HEADED="--headful"
            if [ -n "${PW_PROXY:-}" ]; then HEADED=""; fi
            xvfb-run -a python -m src.timeform.cli -v run --date "$D" \
              --source scrape $HEADED $FLAG
          else
            # Default: Google Drive PDFs. No browser, no display, no login.
            python -m src.timeform.cli -v list-pdfs --date "$D" || true
            python -m src.timeform.cli -v run --date "$D" --source "$SOURCE" $FLAG
          fi

      - name: Upload raw capture artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timeform-raw-${{ github.run_id }}
          path: output/timeform_recon/raw/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timeform-report-${{ github.run_id }}
          path: |
            output/timeform_recon/*.csv
            output/timeform_recon/*.md
            output/timeform_recon/*.html
            output/timeform_recon/correction.json
          retention-days: 30
          if-no-files-found: warn

      - name: Commit reconciliation outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }} || true
          git add output/timeform_recon/history.csv \
                  output/timeform_recon/*.csv \
                  output/timeform_recon/*.md \
                  output/timeform_recon/*.html \
                  output/timeform_recon/correction.json || true
          if git diff --cached --quiet; then
            echo "No new reconciliation outputs to commit"
          else
            git commit -m "Timeform reconciliation for ${{ steps.d.outputs.date }}"
            git push
          fi
