name: Day-After Sectional Ratings

# Sectionals arrive the day after racing, so this runs at ~10pm UK (21:00 UTC)
# and processes YESTERDAY: pull the At The Races PDFs from the Drive folder,
# parse them, update the sectionals store (S3) and pars, apply the uplifts to
# yesterday's live ratings, and send the day-after email.
#
# Requires a Google service account (GDRIVE_SA_JSON) with read access to the
# 'Daily Sectional Reports' folder; AWS_* for the sectionals DB; SMTP_* to send.

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Race date to process (YYYY-MM-DD), empty = yesterday'
        required: false
        default: ''
      send_email:
        description: 'Send the email?'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  sectional-ratings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pandas numpy

      - name: Resolve target date (default = yesterday)
        id: d
        run: |
          DATE_ARG="${{ github.event.inputs.date }}"
          if [ -z "$DATE_ARG" ]; then DATE_ARG=$(date -u -d "yesterday" +%Y-%m-%d); fi
          echo "date=$DATE_ARG" >> "$GITHUB_OUTPUT"

      - name: Run sectional pipeline
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # Temporary: send only to racingsquared@gmail.com while verifying.
          # Remove this line to restore the full distribution list.
          RATINGS_RECIPIENTS: racingsquared@gmail.com
        run: |
          SEND="${{ github.event.inputs.send_email }}"
          FLAG=""
          if [ "$SEND" = "false" ]; then FLAG="--no-email"; fi
          python -m src.sectionals.cli run --date "${{ steps.d.outputs.date }}" $FLAG

      - name: Commit pars artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }} || true
          git add output/sectionals/ || true
          if git diff --cached --quiet; then
            echo "No new par artifacts"
          else
            git commit -m "Sectional pars for ${{ steps.d.outputs.date }}"
            git push
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sectionals-${{ github.run_id }}
          path: |
            output/sectionals/
            data/sectionals_pdfs/
          retention-days: 90
          if-no-files-found: ignore
